title: Electric Power Systems Research (EPSR)
author: Max Domagk
version: 1.0.0
quarto-required: ">=1.4.0"
## epsr-template.tex is elsarticle-template-num.tex of the Elsevier elsarticle bundle with $variables$,
## epsr.sty sets the EPSR layout (double spacing, A4), elsarticle.cls is generated from elsarticle.dtx
## optional in the .qmd: highlights (list), graphical-abstract (file), classoption, linenumbers: true
contributes:
  formats:
    pdf:
      template: epsr-template.tex
      pdf-engine: pdflatex
      number-sections: true
      crossref:
        chapters: false
        fig-title: Fig.
        tbl-title: Table
        fig-prefix: Fig.
        eq-prefix: Eq.
      cite-method: citeproc
      link-citations: true
      execute:
        echo: false
        warning: false
