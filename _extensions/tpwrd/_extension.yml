title: IEEE Transactions on Power Delivery (TPWRD)
author: Max Domagk
version: 2.0.0
quarto-required: ">=1.4.0"
## tpwrd-template.tex is bare_jrnl_new_sample4.tex of the IEEEtran LaTeX template with $variables$
contributes:
  formats:
    pdf:
      template: tpwrd-template.tex
      pdf-engine: pdflatex
      number-sections: true
      ## first word of the first paragraph as drop cap (\IEEEPARstart) as in the template
      filters:
        - tpwrd.lua
      crossref:
        chapters: false
        fig-title: Fig.
        tbl-title: TABLE
        fig-prefix: Fig.
        eq-prefix: ""
      cite-method: citeproc
      link-citations: true
      execute:
        echo: false
        warning: false
